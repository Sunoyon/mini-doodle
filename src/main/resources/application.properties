spring.application.name=mini-doodle

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/doodle}
spring.datasource.username=${DATABASE_USER:doodle}
spring.datasource.password=${DATABASE_PASSWORD:local-dev-only}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.deserialization.fail-on-unknown-properties=true

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

spring.web.error.include-message=never
